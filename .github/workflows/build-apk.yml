name: Build YinYue Debug APK

on:
  workflow_dispatch:

concurrency:
  group: build-yinyue-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK / CMake / SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          which sdkmanager || ls -la "$ANDROID_HOME"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"
          df -h /

      - name: Fix Gradle wrapper + mirrors for overseas runner
        run: |
          set -e
          sed -i 's|^distributionUrl=.*$|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i '/mirrors.cloud.tencent.com/d; /maven.aliyun.com/d' settings.gradle.kts
          sed -i 's/compileSdk = 34/compileSdk = 34\n    ndkVersion = "27.0.12077973"/' app/build.gradle.kts
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo "=== ndkVersion in app/build.gradle.kts ==="
          grep -n "ndkVersion" app/build.gradle.kts

      - name: Build MNN .so (arm64-v8a)
        run: |
          set -e
          MNN_DIR=$GITHUB_WORKSPACE/MNN
          BUILD_DIR=$MNN_DIR/build-android-arm64
          TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          JNILIBS=$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$BUILD_DIR" "$JNILIBS"

          cmake -G "Unix Makefiles" \
            -S "$MNN_DIR" -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_OPENCL=ON \
            -DMNN_USE_LOGCAT=false \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_USE_SSE=OFF \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=true \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_ARM82=ON \
            -DMNN_LLM_BUILD_DEMO=OFF

          echo "=== building MNN ==="
          cmake --build "$BUILD_DIR" --config Release --target MNN -j4

          echo "=== building llm engine ==="
          cmake --build "$BUILD_DIR" --config Release --target llm -j4 \
            || cmake --build "$BUILD_DIR" --config Release --target llm -j1

          for lib in libMNN.so libllm.so libMNN_CL.so; do
            src=$(find "$BUILD_DIR" -name "$lib" -type f | head -1)
            if [ -z "$src" ]; then echo "MISSING $lib"; exit 1; fi
            cp "$src" "$JNILIBS/$lib"
            echo "copied $lib <- $src"
          done

          NDK_PREBUILT=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          cp "$NDK_PREBUILT/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNILIBS/"
          echo "=== jniLibs after MNN ===" && ls -la "$JNILIBS"
          df -h /

      - name: Build llama.cpp .so (arm64-v8a)
        run: |
          set -e
          LLAMA_DIR=$GITHUB_WORKSPACE/llama.cpp
          BUILD_DIR=$LLAMA_DIR/build-android-arm64
          TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          JNILIBS=$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$BUILD_DIR" "$JNILIBS"

          cmake -G "Unix Makefiles" \
            -S "$LLAMA_DIR" -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build "$BUILD_DIR" --config Release \
            --target ggml-base ggml-cpu ggml llama mtmd -j4 \
            || cmake --build "$BUILD_DIR" --config Release \
            --target ggml-base ggml-cpu ggml llama mtmd -j1

          for lib in libggml.so libggml-base.so libggml-cpu.so libllama.so libmtmd.so; do
            src=$(find "$BUILD_DIR" -name "$lib" -type f | head -1)
            if [ -z "$src" ]; then echo "MISSING $lib"; exit 1; fi
            cp "$src" "$JNILIBS/$lib"
            echo "copied $lib <- $src"
          done

          echo "=== jniLibs after llama.cpp ===" && ls -la "$JNILIBS"
          df -h /

      - name: Assemble Debug APK
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.internal.http.socketTimeout=180000 \
            -Dorg.gradle.internal.http.connectionTimeout=180000
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yinyue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
