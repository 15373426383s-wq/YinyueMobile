name: Build YinYue Debug APK

on:
  workflow_dispatch:

concurrency:
  group: build-yinyue-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK / CMake / SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          which sdkmanager || ls -la "$ANDROID_HOME"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"
          df -h /

      - name: Fix mirrors + ndkVersion for overseas runner
        run: |
          set -e
          sed -i '/mirrors.cloud.tencent.com/d; /maven.aliyun.com/d' settings.gradle.kts
          sed -i 's/compileSdk = 34/compileSdk = 34\n    ndkVersion = "27.0.12077973"/' app/build.gradle.kts
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo "=== ndkVersion in app/build.gradle.kts ==="
          grep -n "ndkVersion" app/build.gradle.kts

      - name: Set up Gradle 8.7 (repo has no gradlew wrapper)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version

      - name: Patch app for no-root model loading
        run: |
          set -e
          cat > /tmp/patch_app.py <<'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """YinyueMobile 免 root 模型部署补丁：默认后端 llama + 模型目录改公开目录。"""
          import pathlib, sys
          ROOT = pathlib.Path(sys.argv[1]) if len(sys.argv) > 1 else pathlib.Path(".")
          F = {
              "settings": ROOT/"app/src/main/java/com/yinyue/mobile/data/SettingsStore.kt",
              "modelmgr": ROOT/"app/src/main/java/com/yinyue/mobile/agent/ModelManager.kt",
              "manifest": ROOT/"app/src/main/AndroidManifest.xml",
              "main": ROOT/"app/src/main/java/com/yinyue/mobile/ui/MainActivity.kt",
          }
          done, skip = [], []
          def patch(key, old, new, desc):
              p = F[key]; t = p.read_text(encoding="utf-8")
              if new in t:
                  skip.append(desc); return
              if old not in t:
                  raise SystemExit("[FAIL] %s: 目标文本未找到" % desc)
              p.write_text(t.replace(old, new, 1), encoding="utf-8"); done.append(desc)

          patch("settings",
              'get() = prefs.getString(KEY_LOCAL_BACKEND, "mnn") ?: "mnn"',
              'get() = prefs.getString(KEY_LOCAL_BACKEND, "llama") ?: "llama"',
              "a) 默认后端 mnn -> llama")

          patch("modelmgr",
              '    fun modelDir(): File =\n        File(context.filesDir, "models").also { it.mkdirs() }\n\n    /** MNN 模型目录（与 llama 模型分离） */\n    fun mnnModelDir(): File =\n        File(context.filesDir, "mnn_models").also { it.mkdirs() }\n',
              '    /**\n     * 免 root 部署：模型放到公开目录 /sdcard/YinyueModels，\n     * 文件管理器 / Termux 均可直接写入。\n     */\n    private val publicDir: File\n        get() = File(android.os.Environment.getExternalStorageDirectory(), "YinyueModels")\n\n    fun modelDir(): File =\n        publicDir.also { it.mkdirs() }\n\n    /** MNN 模型目录（与 llama 模型分离，现同用公开目录） */\n    fun mnnModelDir(): File =\n        publicDir\n',
              "b) 模型目录 -> /sdcard/YinyueModels")

          patch("modelmgr",
              '        get() = downloadedModelName == currentModel.name &&\n            ggufFile().exists() &&',
              '        get() = ggufFile().exists() &&',
              "c) isModelReady 去掉模型名匹配")

          patch("modelmgr",
              "var currentModel: ModelInfo = QWEN25_3B",
              "var currentModel: ModelInfo = QWEN3_4B",
              "d) 默认模型 -> Qwen3-4B")

          patch("manifest",
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />',
              "e1) Manifest 增加 MANAGE_EXTERNAL_STORAGE")

          patch("main",
              '    var useLocal by remember { mutableStateOf(settings.useLocalModel) }\n',
              '    var useLocal by remember { mutableStateOf(settings.useLocalModel) }\n\n    // 免 root 部署：开启本地模型时申请「所有文件访问权限」\n    val allFilesAccessLauncher = rememberLauncherForActivityResult(\n        ActivityResultContracts.StartActivityForResult()\n    ) { }\n    androidx.compose.runtime.LaunchedEffect(useLocal) {\n        if (useLocal && !android.os.Environment.isExternalStorageManager()) {\n            runCatching {\n                allFilesAccessLauncher.launch(\n                    Intent(\n                        Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION,\n                        android.net.Uri.parse("package:" + context.packageName)\n                    )\n                )\n            }\n        }\n    }\n',
              "e2) MainActivity 申请所有文件访问权限")

          print("applied=%d skipped=%d" % (len(done), len(skip)))
          for d in done: print("  +", d)
          for d in skip: print("  =", d)

          # 校验改动确实生效
          st = F["settings"].read_text(encoding="utf-8")
          mm = F["modelmgr"].read_text(encoding="utf-8")
          assert '"llama") ?: "llama"' in st, "后端默认值未生效"
          assert "publicDir" in mm and "getExternalStorageDirectory" in mm, "公开目录未生效"
          assert "QWEN3_4B" in mm.split("var currentModel")[1].split("\n")[0], "默认模型未生效"
          PYEOF
          python3 /tmp/patch_app.py "$GITHUB_WORKSPACE"
          echo "=== 校验：modelDir / ggufFile ==="
          grep -n "publicDir\|getExternalStorageDirectory" \
            app/src/main/java/com/yinyue/mobile/agent/ModelManager.kt
          echo "=== 校验：默认后端 ==="
          grep -n 'KEY_LOCAL_BACKEND, "llama"' \
            app/src/main/java/com/yinyue/mobile/data/SettingsStore.kt

      - name: Build MNN .so (arm64-v8a)
        run: |
          set -e
          MNN_DIR=$GITHUB_WORKSPACE/MNN
          BUILD_DIR=$MNN_DIR/build-android-arm64
          TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          JNILIBS=$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$BUILD_DIR" "$JNILIBS"

          cmake -G "Unix Makefiles" \
            -S "$MNN_DIR" -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_OPENCL=ON \
            -DMNN_USE_LOGCAT=false \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_USE_SSE=OFF \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=true \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_ARM82=ON \
            -DMNN_LLM_BUILD_DEMO=OFF \
            -DMNN_BUILD_LLM=ON > /tmp/mnn_cfg.log 2>&1 \
            || { echo "=== MNN CONFIGURE FAILED ==="; tail -n 60 /tmp/mnn_cfg.log; exit 1; }

          echo "=== building MNN core ==="
          cmake --build "$BUILD_DIR" --config Release --target MNN -j4 > /tmp/mnn_build.log 2>&1 \
            || { echo "=== MNN BUILD FAILED (tail) ==="; tail -n 80 /tmp/mnn_build.log; exit 1; }

          echo "=== building llm engine ==="
          cmake --build "$BUILD_DIR" --config Release --target llm -j4 >> /tmp/mnn_build.log 2>&1 \
            || cmake --build "$BUILD_DIR" --config Release --target llm -j1 >> /tmp/mnn_build.log 2>&1 \
            || { echo "=== LLM BUILD FAILED (tail) ==="; tail -n 80 /tmp/mnn_build.log; exit 1; }

          for lib in libMNN.so libllm.so libMNN_CL.so; do
            src=$(find "$BUILD_DIR" -name "$lib" -type f | head -1)
            if [ -z "$src" ]; then echo "MISSING $lib"; exit 1; fi
            cp "$src" "$JNILIBS/$lib"
            echo "copied $lib <- $src"
          done

          NDK_PREBUILT=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          cp "$NDK_PREBUILT/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNILIBS/"
          echo "=== jniLibs after MNN ===" && ls -la "$JNILIBS"
          df -h /

      - name: Build llama.cpp .so (arm64-v8a)
        run: |
          set -e
          LLAMA_DIR=$GITHUB_WORKSPACE/llama.cpp
          BUILD_DIR=$LLAMA_DIR/build-android-arm64
          TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          JNILIBS=$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$BUILD_DIR" "$JNILIBS"

          cmake -G "Unix Makefiles" \
            -S "$LLAMA_DIR" -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build "$BUILD_DIR" --config Release \
            --target ggml-base ggml-cpu ggml llama mtmd -j4 > /tmp/llama_build.log 2>&1 \
            || cmake --build "$BUILD_DIR" --config Release \
            --target ggml-base ggml-cpu ggml llama mtmd -j1 >> /tmp/llama_build.log 2>&1 \
            || { echo "=== LLAMA BUILD FAILED (tail) ==="; tail -n 80 /tmp/llama_build.log; exit 1; }

          for lib in libggml.so libggml-base.so libggml-cpu.so libllama.so libmtmd.so; do
            src=$(find "$BUILD_DIR" -name "$lib" -type f | head -1)
            if [ -z "$src" ]; then echo "MISSING $lib"; exit 1; fi
            cp "$src" "$JNILIBS/$lib"
            echo "copied $lib <- $src"
          done

          echo "=== jniLibs after llama.cpp ===" && ls -la "$JNILIBS"
          df -h /

      - name: Assemble Debug APK
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          gradle assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.internal.http.socketTimeout=180000 \
            -Dorg.gradle.internal.http.connectionTimeout=180000 \
            > /tmp/gradle.log 2>&1 \
            || { echo "=== GRADLE FAILED (tail) ==="; tail -n 120 /tmp/gradle.log; exit 1; }
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload build logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/mnn_cfg.log
            /tmp/mnn_build.log
            /tmp/llama_build.log
            /tmp/gradle.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yinyue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
