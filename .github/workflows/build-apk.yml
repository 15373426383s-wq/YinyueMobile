name: Build YinYue Debug APK

on:
  workflow_dispatch:

concurrency:
  group: build-yinyue-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages (platform / build-tools / NDK / CMake)
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_HOME = $ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build MNN .so (arm64-v8a)
        run: |
          set -e
          MNN_DIR=$GITHUB_WORKSPACE/MNN
          BUILD_DIR=$MNN_DIR/build-android-arm64
          TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          JNILIBS=$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$BUILD_DIR" "$JNILIBS"

          cmake -G "Unix Makefiles" \
            -S "$MNN_DIR" -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DMNN_OPENCL=ON \
            -DMNN_USE_LOGCAT=false \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_USE_SSE=OFF \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=true \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_SEP_BUILD=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_ARM82=ON \
            -DMNN_LLM_BUILD_DEMO=OFF

          cmake --build "$BUILD_DIR" --config Release --target MNN -j4
          cmake --build "$BUILD_DIR" --config Release --target llm  -j4

          find "$BUILD_DIR" -name 'libMNN.so'    | head -1 | xargs -I{} cp {} "$JNILIBS/libMNN.so"
          find "$BUILD_DIR" -name 'libllm.so'     | head -1 | xargs -I{} cp {} "$JNILIBS/libllm.so"
          find "$BUILD_DIR" -name 'libMNN_CL.so'  | head -1 | xargs -I{} cp {} "$JNILIBS/libMNN_CL.so"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNILIBS/"
          echo "=== MNN jniLibs ===" && ls -la "$JNILIBS"

      - name: Build llama.cpp .so (arm64-v8a)
        run: |
          set -e
          LLAMA_DIR=$GITHUB_WORKSPACE/llama.cpp
          BUILD_DIR=$LLAMA_DIR/build-android-arm64
          TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          JNILIBS=$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$BUILD_DIR" "$JNILIBS"

          cmake -G "Unix Makefiles" \
            -S "$LLAMA_DIR" -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build "$BUILD_DIR" --config Release --target ggml ggml-base ggml-cpu llama mtmd -j4
          cp "$BUILD_DIR"/bin/*.so "$JNILIBS"/
          echo "=== all jniLibs ===" && ls -la "$JNILIBS"

      - name: Assemble Debug APK
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yinyue-debug-apk
          path: app/build/outputs/apk/debug/*.apk
